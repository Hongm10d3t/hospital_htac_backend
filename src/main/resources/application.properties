spring.application.name=htac-backend
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.jdbc.core=INFO
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:htac}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:htac}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
his.pharmacy.expiry-warning-days=${HIS_PHARMACY_EXPIRY_WARNING_DAYS:30}
